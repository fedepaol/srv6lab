name: poc

topology:
  nodes:
    HOST1:
      kind: linux
      image: praqma/network-multitool:latest
      binds:
        - host1/setup.sh:/setup.sh
    HOST2:
      kind: linux
      image: praqma/network-multitool:latest
      binds:
        - host2/setup.sh:/setup.sh
    pe:
      kind: linux
      image: quay.io/frrouting/frr:10.4.1
      binds:
        - pe/:/etc/frr/
        - pe/setup.sh:/setup.sh
    al:
      kind: linux
      image: quay.io/frrouting/frr:10.4.1
      binds:
        - al/:/etc/frr/
        - al/setup.sh:/setup.sh
    bl:
      kind: linux
      image: quay.io/frrouting/frr:10.4.1
      binds:
        - bl/:/etc/frr/
        - bl/setup.sh:/setup.sh
    sp:
      kind: linux
      image: quay.io/frrouting/frr:10.4.1
      binds:
        - sp/:/etc/frr/
        - sp/setup.sh:/setup.sh

  links:
    - endpoints: ["HOST1:eth1", "pe:eth1"]
    - endpoints: ["pe:eth2", "al:eth1"]
    - endpoints: ["al:eth2", "sp:eth1"]
    - endpoints: ["sp:eth2", "bl:eth1"]
    - endpoints: ["bl:eth2", "HOST2:eth1"]
