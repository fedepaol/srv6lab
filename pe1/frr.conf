log file /tmp/frr.log debug
debug zebra events
debug bgp zebra
debug bgp updates
debug bgp neighbor-events
interface eth1
 ip router isis PE
 ipv6 router isis PE

exit
interface lo
 ip router isis PE
 ipv6 router isis PE
exit
router bgp 65500
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 no bgp network import-check
 neighbor TOR peer-group
 neighbor TOR remote-as 65500
 neighbor TOR update-source fc00:0:1::1
 neighbor fc00:0:10::1 peer-group TOR
 neighbor EVPN-CLIENTS peer-group
 neighbor EVPN-CLIENTS remote-as 65500
 neighbor EVPN-CLIENTS update-source fc00:0:1::1
 neighbor fc00:0:2::1 peer-group EVPN-CLIENTS
 neighbor fc00:0:3::1 peer-group EVPN-CLIENTS
 segment-routing srv6
  locator MAIN
 exit
 address-family ipv4 vpn
  neighbor TOR activate
 exit-address-family
 address-family ipv6 vpn
  neighbor TOR activate
 exit-address-family
 address-family l2vpn evpn
  neighbor EVPN-CLIENTS activate
  neighbor EVPN-CLIENTS route-reflector-client
  advertise-all-vni
  advertise-svi-ip
 exit-address-family
exit
router bgp 65500 vrf red
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 no bgp network import-check
 sid vpn per-vrf export auto
 address-family ipv4 unicast
  network 10.10.1.1/32
  network 192.168.10.0/24
  rd vpn export 10.0.0.1:2
  rt vpn both 65500:2
  export vpn
  import vpn
 exit-address-family
 address-family ipv6 unicast
  network fc00:10:1::1/128
  rd vpn export 10.0.0.1:2
  rt vpn both 65500:2
  export vpn
  import vpn
 exit-address-family
exit
router isis PE
 is-type level-1
 net 49.0001.0000.0000.0001.00
 topology ipv6-unicast
 log-adjacency-changes
 log-pdu-drops
 segment-routing on
 segment-routing srv6
  locator MAIN
 exit
exit
segment-routing
 srv6
  encapsulation
   source-address fd00:1::1
  locators
   locator MAIN
    prefix fd00:1::/48 block-len 32 node-len 16
    behavior usid
   exit
  exit
 exit
exit
end
