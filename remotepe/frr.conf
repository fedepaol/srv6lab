log file /tmp/frr.log debug
debug zebra events
debug bgp zebra
debug bgp updates
debug bgp neighbor-events
interface eth1
 ip router isis PE
 ipv6 router isis PE
 isis network point-to-point
exit
interface lo
 ip router isis PE
 ipv6 router isis PE
exit
router bgp 65500
 bgp router-id 10.0.0.20
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 no bgp network import-check
 neighbor TOR peer-group
 neighbor TOR remote-as 65500
 neighbor TOR update-source fc00:0:20::1
 neighbor fc00:0:10::1 peer-group TOR

 segment-routing srv6
  locator MAIN
 exit
 address-family ipv4 vpn
  neighbor TOR activate
 exit-address-family
 address-family ipv6 vpn
  neighbor TOR activate
 exit-address-family

exit
router bgp 65500 vrf red
 bgp router-id 10.0.0.20
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 no bgp network import-check
 sid vpn per-vrf export auto
 address-family ipv4 unicast
  network 10.10.20.1/32

  rd vpn export 10.0.0.20:2
  rt vpn both 65500:2
  export vpn
  import vpn
 exit-address-family
 address-family ipv6 unicast
  network fc00:10:20::1/128
  rd vpn export 10.0.0.20:2
  rt vpn both 65500:2
  export vpn
  import vpn
 exit-address-family
exit
router isis PE
 is-type level-1
 net 49.0001.0000.0000.0020.00
 topology ipv6-unicast
 log-adjacency-changes
 log-pdu-drops
 segment-routing on
 segment-routing srv6
  locator MAIN
 exit
exit
segment-routing
 srv6
  encapsulation
   source-address fd00:20::1
  locators
   locator MAIN
    prefix fd00:20::/48 block-len 32 node-len 16
    behavior usid
   exit
  exit
 exit
exit
end
